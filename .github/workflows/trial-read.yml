# TRIAL, not for merging. Reads what GitHub Pages says each kind of file of
# the published site is, so that the plan of FND-053 states it from the real
# site. It only asks for the headers of public files and is given no secret.
name: TRIAL read what the published site says its files are

on:
  pull_request:

permissions: {}

jobs:
  read:
    name: Read the content types
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask for one file of each kind
        run: |
          for f in "" index.html licences.txt favicon.svg favicon.ico apple-touch-icon.png data/manifest.json \
            cesium/ThirdParty/wasm_splats_bg.wasm cesium/ThirdParty/zip-module.wasm \
            cesium/ThirdParty/basis_transcoder.wasm cesium/ThirdParty/draco_decoder.wasm \
            cesium/Assets/Textures/NaturalEarthII/tilemapresource.xml \
            cesium/Assets/Textures/waterNormals.jpg cesium/Assets/Textures/waterNormalsSmall.jpg \
            cesium/Workers/decodeDraco.js cesium/ThirdParty/Workers/package.json \
            cesium/Widgets/CesiumWidget/CesiumWidget.css cesium/Assets/Textures/maki/campsite.png \
            cesium/Assets/Textures/pin.svg cesium/Assets/Images/bing_maps_credit.png cesium/nothing.wasm; do
            echo "FILE /$f"
            curl -sS -m 30 -o /dev/null -D - "https://bigdaddy284.github.io/MotoSphere/$f" \
              | tr -d '\r' | grep -i -E "^HTTP|^content-type:|^content-encoding:|^content-length:" | sed 's/^/  SAYS /'
            curl -sS -m 30 --compressed -H "Accept-Encoding: gzip" -o /dev/null -D - "https://bigdaddy284.github.io/MotoSphere/$f" \
              | tr -d '\r' | grep -i -E "^content-type:|^content-encoding:" | sed 's/^/  PACKED /'
          done
